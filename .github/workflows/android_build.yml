name: Android Build

# This workflow builds the OrbitX Launcher APK
# Runs on pushes to main, pull requests, and tag pushes

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Cancel previous runs on same branch
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 10.0
          accept-android-sdk-licenses: yes
          packages: |
            platforms;android-34
            build-tools;34.0.0
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Create output directory
        run: mkdir -p output
      
      - name: Rename and copy debug APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk output/OrbitX-Launcher-debug.apk
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Launcher-Debug
          path: output/OrbitX-Launcher-debug.apk
          retention-days: 30
      
      - name: Build release APK (on tags only)
        if: github.ref_type == 'tag'
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      
      - name: Rename and copy release APK
        if: github.ref_type == 'tag'
        run: |
          cp app/build/outputs/apk/release/app-release.apk output/OrbitX-Launcher-release.apk
      
      - name: Upload release APK
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Launcher-Release
          path: output/OrbitX-Launcher-release.apk
          retention-days: 90
      
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: output/OrbitX-Launcher-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
