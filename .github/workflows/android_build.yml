name: Android Build

# This workflow builds the OrbitX Launcher APK on every push to main branch
# and creates a release APK when a new tag is pushed

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Cancel previous runs if a new commit is pushed
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: 26.2.11394342
          cmake-version: 3.22.1
          accept-licenses: yes
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Cache Android build
        uses: actions/cache@v3
        with:
          path: |
            app/build
            ~/.android
          key: ${{ runner.os }}-build-${{ hashFiles('**/*.gradle*', '**/*.kt', '**/*.java') }}
          restore-keys: |
            ${{ runner.os }}-build-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Clean build
        run: ./gradlew clean
      
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Build release APK
        if: github.ref_type == 'tag'
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      
      - name: Rename debug APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OrbitX-Launcher-${{ github.sha }}-debug.apk
      
      - name: Rename release APK
        if: github.ref_type == 'tag'
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/OrbitX-Launcher-${{ github.ref_name }}-release.apk
      
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Launcher-Debug
          path: app/build/outputs/apk/debug/OrbitX-Launcher-*.apk
          retention-days: 30
      
      - name: Upload release APK artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Launcher-Release
          path: app/build/outputs/apk/release/OrbitX-Launcher-*.apk
          retention-days: 90
      
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/OrbitX-Launcher-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Additional job for testing
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Results
          path: app/build/reports/tests/
          retention-days: 7

  # Job for building with different Java versions
  java-compatibility:
    name: Java Compatibility Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['11', '17', '21']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Check build compatibility
        run: ./gradlew :app:dependencies --no-daemon

  # Job for static analysis
  lint:
    name: Run Lint
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run lint
        run: ./gradlew lintDebug --no-daemon --stacktrace
      
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lint-Results
          path: app/build/reports/lint-results-*.html
          retention-days: 7
