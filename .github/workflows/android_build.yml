name: Android Build

# This workflow builds the OrbitX Launcher APK
# Runs on pushes to main, pull requests, and tag pushes

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Cancel previous runs on same branch
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          accept-licenses: yes
          ndk: false
          cmake: false
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Cache Android build
        uses: actions/cache@v3
        with:
          path: |
            app/build
            ~/.android
          key: ${{ runner.os }}-build-${{ hashFiles('**/*.gradle*', '**/*.kt', '**/*.java') }}
          restore-keys: |
            ${{ runner.os }}-build-
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Clean project
        run: ./gradlew clean --no-daemon
      
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Rename debug APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/OrbitX-Launcher-debug.apk
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Launcher-Debug
          path: output/OrbitX-Launcher-debug.apk
          retention-days: 30
      
      - name: Build release APK (on tags only)
        if: github.ref_type == 'tag'
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      
      - name: Rename release APK
        if: github.ref_type == 'tag'
        run: |
          cp app/build/outputs/apk/release/app-release.apk output/OrbitX-Launcher-release.apk
      
      - name: Upload release APK
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Launcher-Release
          path: output/OrbitX-Launcher-release.apk
          retention-days: 90
      
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: output/OrbitX-Launcher-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
